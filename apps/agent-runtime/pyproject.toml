[project]
name = "nexus-runtime"
version = "0.1.0"
description = "Agent Runtime bootstrap for Nexus AI."
readme = "README.md"
requires-python = "==3.13.*"
dependencies = []

[project.scripts]
nexus-runtime = "nexus_runtime.main:main"

[build-system]
requires = ["uv_build==0.13.7"]
build-backend = "uv_build"

[tool.uv]
required-version = "==0.13.7"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]
